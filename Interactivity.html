<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactivity with tailwind css</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body>
    <button class="bg-blue-500 rounded-md px-4 py-1 m-4 text-white">
      Login
    </button>

    <button
      class="bg-blue-500 rounded-md px-4 py-1 m-4 text-white hover:bg-red-500 hover:px-5"
    >
      Login
    </button>

    <button
      class="bg-blue-500 rounded-md px-4 py-1 m-4 text-white focus:bg-red-500"
    >
      Login
    </button>

    <button
      class="bg-blue-500 rounded-md px-4 py-1 m-4 text-white active:bg-red-500"
    >
      Login
    </button>

    <div class="group p-4 border">
      <h3 class="text-gray-700 group-hover:text-blue-500">Product Title</h3>
    </div>

    <div class="group w-64 p-4 border rounded mt-10">
      <img src="./Page.JPG" class="transition-transform group-hover:scale-110" />

      <h3 class="mt-2 group-hover:text-blue-500">Product Name</h3>
    </div>

  </body>
</html>
